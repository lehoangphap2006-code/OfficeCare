spring.application.name=quan-ly-tai-san
spring.datasource.url=jdbc:mysql://localhost:3306/quan_ly_tai_san?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8081
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.security.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}
app.security.login.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:5}
app.security.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}
app.security.login.ip-max-attempts=${LOGIN_IP_MAX_ATTEMPTS:20}
app.security.login.ip-window-seconds=${LOGIN_IP_WINDOW_SECONDS:60}
app.security.login.ip-max-tracked-addresses=${LOGIN_IP_MAX_TRACKED_ADDRESSES:10000}
app.security.seed-demo-users=${SEED_DEMO_USERS:true}
app.security.oauth.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
app.security.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.security.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.security.oauth.google.frontend-url=${FRONTEND_URL:http://localhost:5500}
app.payment.momo.enabled=${MOMO_ENABLED:false}
app.payment.momo.partner-code=${MOMO_PARTNER_CODE:}
app.payment.momo.access-key=${MOMO_ACCESS_KEY:}
app.payment.momo.secret-key=${MOMO_SECRET_KEY:}
app.payment.momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
app.payment.momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:5500/admin/procurement?momo_return=1}
app.payment.momo.ipn-url=${MOMO_IPN_URL:}
app.security.demo-admin-password=${DEMO_ADMIN_PASSWORD:Admin@12345}
app.security.demo-user-password=${DEMO_USER_PASSWORD:User@12345}
